<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>店策轻量哨兵</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand-mark">策</div>
        <div>
          <h1>店策轻量哨兵</h1>
          <p>只看状态 · 点击才取数</p>
        </div>
        <span class="read-only">零自动扫描</span>
      </header>

      <section id="overall" class="overall pending">
        <span class="pulse"></span>
        <div>
          <strong id="overall-title">正在检查连接</strong>
          <p id="overall-detail">不会在后台巡查店铺页面</p>
        </div>
      </section>

      <section class="source-grid" aria-label="数据源状态">
        <article class="source-card">
          <div class="source-head">
            <div><span class="source-icon shop">店</span><strong>抖店</strong></div>
            <span id="doudian-state" class="tag idle">检测中</span>
          </div>
          <p id="doudian-detail">等待识别页面</p>
          <button class="text-button" data-open="doudian">打开抖店 →</button>
        </article>
        <article class="source-card">
          <div class="source-head">
            <div><span class="source-icon ads">投</span><strong>千川</strong></div>
            <span id="qianchuan-state" class="tag idle">检测中</span>
          </div>
          <p id="qianchuan-detail">等待识别页面</p>
          <button class="text-button" data-open="qianchuan">打开千川 →</button>
        </article>
      </section>

      <section class="api-sentinel" aria-live="polite">
        <div class="api-heading">
          <div>
            <strong>千川官方 API</strong>
            <p id="api-detail">正在检查授权状态</p>
          </div>
          <span id="api-state" class="tag idle">检测中</span>
        </div>
        <button id="api-sync-button" disabled>同步官方数据</button>
        <small id="api-sync-note">只在点击时读取计划、报表与素材，不修改投放。</small>
      </section>

      <section class="settings-row">
        <div>
          <strong>隐私脱敏始终开启</strong>
          <p>手机号、证件号、邮箱和账号标识默认掩码</p>
        </div>
        <span class="shield" aria-hidden="true">✓</span>
      </section>

      <section class="actions">
        <button id="sync-button" class="primary">同步当前页面</button>
        <button id="panel-button" class="secondary">完整工作台</button>
      </section>

      <footer>
        <span id="last-sync">尚未同步</span>
        <span>轻量哨兵 · 仅本机</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
